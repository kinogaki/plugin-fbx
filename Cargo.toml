[package]
name = "kinogaki-fbx"
description = "FBX as a read-only format plugin for Kinogaki Studio: binary (7.1-7.7) and ASCII FBX read into the standard values, nodes placed in the project's units, meshes with their layers, materials as MaterialX networks of each shader family's model, textures, cameras and lights"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

# The format builds from its own repository, the public SDK's and
# lib-image's alone, checked out side by side as Studio's tree lays them out
# (README "Building"): its manifest names everything it needs instead of
# inheriting it from the tree.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
# The standard values a read gives, and the process's workers arrays
# decode on.
kinogaki-studio-api = { path = "../../sdk/crates/api" }
# The standard light and camera, and MaterialX nodes' definitions.
kinogaki-render-api = { path = "../../sdk/crates/render-api" }
# MaterialX's library: the definitions materials are built of.
kinogaki-mtlx = { path = "../../sdk/crates/mtlx" }
# Compressed arrays are zlib streams (lib-image's DEFLATE).
kinogaki-deflate = { path = "../../libs/lib-image/crates/deflate" }

[dev-dependencies]
# The SDK's color service that converts nothing.
kinogaki-studio-api-testing = { path = "../../sdk/crates/api-testing" }
